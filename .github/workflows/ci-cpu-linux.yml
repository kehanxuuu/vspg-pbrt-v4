name: cpu-linux-build-and-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  build:
    strategy:
      matrix:
        config: [ '-DPBRT_WITH_OIDN=False' ] # '', '-DPBRT_WITH_RGB=False', '-DPBRT_DBG_LOGGING=True', '-DPBRT_FLOAT_AS_DOUBLE=True' ]
        compilers:
        #- {
        #    cc: "gcc-10",
        #    cxx: "g++-10",
        #  }
        #- {
        #    cc: "gcc-11",
        #    cxx: "g++-11",
        #  }
        - {
            cc: "gcc-12",
            cxx: "g++-12",
          }
        #- {
        #    cc: "clang-14",
        #    cxx: "clang++-14",
        #  }

      fail-fast: false

    runs-on: ubuntu-22.04
    name: Build and test ${{ matrix.compilers.cxx }} - ${{ matrix.config }}

    steps:
    - name: Checkout pbrt
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Checkout rgb2spectrum tables
      uses: actions/checkout@v4
      with:
        repository: mmp/rgb2spectrum
        path: build
      
    - name: Get cmake
      uses: lukka/get-cmake@latest

    # this step install an very old version, unused for this branch.. disable it for now
    #- name: Install OpenEXR
    #  run: sudo apt-get -y install libopenexr-dev

    - name: Install OpenGL
      run: sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-0

    - name: Install compilers
      run: sudo apt-get -y install ${{ matrix.compilers.cc }} ${{ matrix.compilers.cxx }}

    - name: Configure
      run: |
        cd build
        env CC=${{ matrix.compilers.cc }} CXX=${{ matrix.compilers.cxx }} cmake .. -DPBRT_USE_PREGENERATED_RGB_TO_SPECTRUM_TABLES=True -DCMAKE_INSTALL_PREFIX=./deploy ${{ matrix.config }}
      
    - name: Build
      run: cmake --build build --parallel 4 --config Release --target install

    - name: Save Linux executable
      if: ${{ matrix.config == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: pbrt-v4_ubuntu-22.04_${{ matrix.compilers.cc }}
        path: "${{ github.workspace }}/build/deploy/bin/"
        retention-days: 1
    
    - name: Test
      if: ${{ matrix.config == '-DPBRT_WITH_RGB=False' }}
      run: ./pbrt_test
      working-directory: build
